# 反向代理示例：网页和接口放在同一个域名下（网页端的 Cookie 登录要求同源），SSE 必须关闭缓冲，
# 否则客户端要等整段生成完才能看到文字。
#
# 网页端先构建：cd apps/web && npm run build，把 apps/web/dist 放到下面 root 指的目录。
# 用 deploy/docker-compose.yml 自己部署时不用这么配：web 容器已经发网页、转接口了（nginx.web.conf），
# 外面的反向代理只管 TLS，把所有请求转给 web 的端口（默认 127.0.0.1:8080）就行，同样要关掉缓冲。
# 手机 App 只用到 /v1，连这个域名就行。
server {
    listen 443 ssl;
    server_name tavern.example.com;

    # ssl_certificate     /etc/ssl/...;
    # ssl_certificate_key /etc/ssl/...;

    # 角色卡上传最大 16 MB（服务端自己也会检查）；nginx 默认只放行 1 MB
    client_max_body_size 17m;

    # 接口：/v1、/health、/ready 转给 api
    location ~ ^/(v1/|health$|ready$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # api 靠它认出每个用户的真实 IP（注册、登录按 IP 限流）；api 那边的 FORWARDED_ALLOW_IPS 要包含 nginx 的地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    # 网页端：带哈希的静态文件长期缓存；其余地址都回到 index.html（前端路由），index.html 不缓存
    root /srv/bettertavern/web;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
