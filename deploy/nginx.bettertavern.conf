# bettertavern.com 的 nginx 配置（宿主机上的 nginx，放在 /etc/nginx/sites-available/bettertavern，
# 软链接到 sites-enabled）。部署脚本每次会复制它并 reload，改这里就行。
#
# 流量：用户 → Cloudflare（代理、HTTPS）→ 这台服务器的 443（Cloudflare 的源站证书）→ 本机 8000（api 容器）。
# - 80、443 只放行 Cloudflare 的 IP（防火墙，见 deploy/server-setup.sh），直连服务器 IP 进不来；
# - 真实 IP 取 Cloudflare 带来的 CF-Connecting-IP（snippets/cloudflare-realip.conf，由 deploy/cloudflare-ips.sh 生成）；
# - 网页和接口同源：/v1、/health、/ready 转给 api，其余是网页的静态文件（/srv/bettertavern/web）。
# 证书：Cloudflare 后台 SSL/TLS › Origin Server 签发的源站证书，放在 /etc/ssl/bettertavern/，
# Cloudflare 的 SSL 模式设为 Full (strict)。

# 不认识的域名和直接用 IP 访问：断开连接，不回任何内容
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# http 一律跳到 https（Cloudflare 一般已经跳过了，这里兜底）
server {
    listen 80;
    listen [::]:80;
    server_name bettertavern.com www.bettertavern.com;
    return 301 https://bettertavern.com$request_uri;
}

# www 跳到不带 www 的地址
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bettertavern.com;
    ssl_certificate /etc/ssl/bettertavern/origin.pem;
    ssl_certificate_key /etc/ssl/bettertavern/origin.key;
    return 301 https://bettertavern.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bettertavern.com;

    ssl_certificate /etc/ssl/bettertavern/origin.pem;
    ssl_certificate_key /etc/ssl/bettertavern/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/cloudflare-realip.conf;
    server_tokens off;

    # 角色卡、图片上传最大 16 MB（服务端自己也会检查）
    client_max_body_size 17m;

    # 安全头（每个 location 里如果再写 add_header，要把这几行也带上，nginx 不会继承）。
    # CSP 和网页端的 vite.config.ts 里 preview 的那一份保持一致：网页只从本站加载脚本、样式、图片和接口
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 接口：转给 api。推送（SSE）必须关掉缓冲，否则要等整段写完才看得到字
    location ~ ^/(v1/|health$|ready$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 经过 cloudflare-realip.conf，$remote_addr 已经是用户的真实 IP；api 按它限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    root /srv/bettertavern/web;

    # 带哈希的静态文件长期缓存（旧版本的文件部署时不删，开着旧页面的人还能加载）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 其余地址都回到 index.html（前端路由）；index.html 不缓存，部署后马上换成新版本
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
