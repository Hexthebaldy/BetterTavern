# 自己部署时网页容器里的 nginx（deploy/Dockerfile.web，放在 /etc/nginx/conf.d/default.conf）：
# 发网页的静态文件；/v1、/health、/ready 转给 api 容器（网页和接口同源，Cookie 登录要求这样）。
# 只说 http。要从外网用，在前面再放一层带 TLS 的反向代理转到这个容器的端口（deploy/docker-compose.yml 开头）。
# 线上 bettertavern.com 用的是 deploy/nginx.bettertavern.conf，不是这一份。

# 前面那层代理带来的协议（https）原样转给 api；直接连进来的就是 http
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_tokens off;

    # 角色卡、图片上传最大 16 MB（服务端自己也会检查）
    client_max_body_size 17m;

    # 用户的真实 IP（api 按它给注册、登录限流）：前面有一层反向代理（本机、Docker 内网或局域网的地址）时，
    # 取它带来的 X-Forwarded-For；直接连进来的就是对方自己的地址
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 安全头（同 nginx.bettertavern.conf，只是没有 HSTS：这里是 http）。
    # 某个 location 里再写 add_header 时要把这几行也带上，nginx 不会继承
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 接口：转给 api 容器。地址用变量写、交给 Docker 的 DNS 解析：api 还没起来时 nginx 也能启动，
    # api 重建换了 IP 也找得到。推送（SSE）必须关掉缓冲，否则要等整段写完才看得到字
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    location ~ ^/(v1/|health$|ready$) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    root /usr/share/nginx/html;

    # 带哈希的静态文件长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 其余地址都回到 index.html（前端路由）；index.html 不缓存，更新以后马上换成新版本
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
