# 自己部署全套：docker compose -f deploy/docker-compose.yml up -d
# 单实例用进程内事件缓冲，所以只需要 api、worker、postgres 三个常驻容器；migrate 跑完即退出。
# api 只监听本机 8000 端口：对外请放在带 TLS 的反向代理后面（示例见 nginx.example.conf）。
x-server: &server
  build:
    context: ..
    dockerfile: deploy/Dockerfile.server
  environment:
    DATABASE_URL: postgresql+asyncpg://bettertavern:${POSTGRES_PASSWORD:-bettertavern}@postgres:5432/bettertavern
    ENV: prod
    ENABLE_PROBE_ENDPOINTS: ${ENABLE_PROBE_ENDPOINTS:-false}
    ALLOW_PRIVATE_ENDPOINTS: ${ALLOW_PRIVATE_ENDPOINTS:-false}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  # 要比 SHUTDOWN_GRACE_S / WORKER_SHUTDOWN_GRACE_S（默认 60 秒）长，进行中的回合和任务才能收尾
  stop_grace_period: 75s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bettertavern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bettertavern}
      POSTGRES_DB: bettertavern
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bettertavern"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *server
    command: ["bettertavern", "migrate"]
    restart: "no"

  api:
    <<: *server
    command: ["bettertavern", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *server
    command: ["bettertavern", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
