# 本地开发只需要 Postgres：make db-up
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bettertavern
      POSTGRES_PASSWORD: bettertavern
      POSTGRES_DB: bettertavern
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bettertavern"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
