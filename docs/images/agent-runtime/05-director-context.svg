ormal" class="text-inner-tspan" font-style="normal">②</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> system</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 后半：每章结束时才变</tspan></tspan><tspan dy="1.1em" y="1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">＜recap＞</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 回顾：全书梗概</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> ·</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 最近</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 3</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 章的章节摘要</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> ·</tspan></tspan><tspan dy="1.1em" y="2.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">玩家画像</tspan></tspan></text></g></g></g><g transform="translate(238, 336.0499954223633)" id="flowchart-s3-2" class="node default"><rect height="105.30000305175781" width="428.3125" y="-52.650001525878906" x="-214.15625" style="" class="basic label-container"/><g transform="translate(0, -37.650001525878906)" style="" class="label"><rect/><g><rect style="stroke: none" class="background"/><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">③</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 原文：一章里只在末尾追加</tspan></tspan><tspan dy="1.1em" y="1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">user：玩家行动</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> →</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> assistant：当时的叙述</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> +</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 选项</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> +</tspan></tspan><tspan dy="1.1em" y="2.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">隐藏备注</tspan></tspan><tspan dy="1.1em" y="3.2em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">当前这一章的每一回合，再加上一章最后</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 2</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 回合</tspan></tspan></text></g></g></g><g transform="translate(238, 500.14999771118164)" id="flowchart-s4-3" class="node default"><rect height="122.9000015258789" width="460" y="-61.45000076293945" x="-230" style="" class="basic label-container"/><g transform="translate(0, -46.45000076293945)" style="" class="label"><rect/><g><rect style="stroke: none" class="background"/><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">④</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 最后一条</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> user：每回合都变</tspan></tspan><tspan dy="1.1em" y="1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">＜world-state＞</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 状态块（截至第几回合）</tspan></tspan><tspan dy="1.1em" y="2.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">＜outline＞</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> 大纲：前提</tspan><tspan font-weight="normal" class