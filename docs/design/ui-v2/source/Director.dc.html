<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导演模型</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.L{--bg:#FFFFFF;--bg2:#F7F7F5;--bg3:#EFEFEC;--ink:#111111;--ink2:#37352F;--mut:#6B6A66;--line:#E8E8E5;--line2:#D3D3CF;--acc:#2747FF;--accBg:#EEF1FF;--ok:#0B8A55;--warn:#B45309;--warnBg:#FDF3E3;--err:#D92D20;--errBg:#FDECEA;--pri:#111111;--onPri:#FFFFFF}
.D{--bg:#0E0E0E;--bg2:#171717;--bg3:#222222;--ink:#F2F2F0;--ink2:#D6D6D2;--mut:#9A9A95;--line:#262626;--line2:#363636;--acc:#7C8CFF;--accBg:#1A1F3D;--ok:#3CCB8A;--warn:#F2B04C;--warnBg:#2B2112;--err:#FF6B5E;--errBg:#2E1513;--pri:#F2F2F0;--onPri:#0E0E0E}
.ph{width:390px;min-height:1560px;position:relative;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
.ph *{box-sizing:border-box;border-radius:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:0;font-family:inherit;font-size:16px;line-height:22px;font-weight:500;text-decoration:none;cursor:pointer;width:100%}
.bp{background:var(--pri);color:var(--onPri)}
.bs{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:32px 20px 12px;border-bottom:2px solid var(--ink)}
.sec h2{margin:0;font-size:20px;line-height:26px;font-weight:700}
.sec span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--mut);letter-spacing:.06em}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:18px;color:var(--ink2)}
.sw{width:12px;height:12px;flex:none}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));box-shadow:inset 0 0 0 1px var(--line2)}
.sg{height:52px;border:0;background:transparent;font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2)}
.sg:last-child{border-right:0}
.cap{font-size:13px;line-height:20px;color:var(--mut)}
</style>
</helmet>
<div class="ph {{theme}}">
  <a href="#" aria-label="返回设置" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: 56px 0 0 10px; color: var(--ink)"><svg class="i" style="width: 24px; height: 24px" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>

  <sc-if value="{{isSet}}" hint-placeholder-val="{{true}}">
    <header style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--ink)">
      <span class="mono" style="font-size: 11.5px; letter-spacing: .08em; color: var(--mut)">导演模型</span>
      <h1 class="mono" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -.02em; word-break: break-all">deepseek-chat</h1>
      <a href="#" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); text-decoration: none"><span class="mono" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--bg); font-size: 9.5px">DS</span>我的 DeepSeek · <span class="mono">•••• 3f9a</span></a>
    </header>

    <div class="sec"><h2>能记住多少</h2><span>上下文 128K</span></div>
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="position: relative; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px" role="img" aria-label="{{barLabel}}">
        <sc-for list="{{blocks}}" as="b" hint-placeholder-count="32">
          <span style="aspect-ratio: 1; {{b.style}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 16px">
        <span class="lg"><span class="sw" style="background: var(--ink)"></span>故事 {{storyK}}</span>
        <span class="lg"><span class="sw" style="background: var(--acc)"></span>每轮输出 8K</span>
        <span class="lg"><span class="sw" style="box-shadow: inset 0 0 0 1px var(--line2)"></span>不使用 {{freeK}}</span>
        <span class="lg"><span class="sw" style="box-shadow: inset 0 0 0 2px var(--warn)"></span>到这里开始压缩</span>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 23px; color: var(--ink2)">{{explain}}</p>
    </div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 500" id="wl">工作窗口上限</div>
      <div class="seg" role="radiogroup" aria-labelledby="wl">
        <sc-for list="{{wins}}" as="w" hint-placeholder-count="4">
          <button class="sg" type="button" role="radio" aria-checked="{{w.on}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button>
        </sc-for>
      </div>
      <div class="cap">窗口越大，导演记得越多，但每轮更慢、更贵。用到 80% 时，早期剧情会被压缩成摘要。</div>
      <sc-if value="{{capped}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--warnBg); box-shadow: inset 0 0 0 1px var(--warn); font-size: 13.5px; line-height: 21px">
          <svg class="i" style="width: 18px; height: 18px; color: var(--warn); margin-top: 1px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg>
          <span>这个模型只有 128K 上下文，工作窗口会按 128K 算。</span>
        </div>
      </sc-if>
    </div>

    <div class="sec"><h2>写法</h2><span></span></div>
    <button type="button" role="switch" aria-checked="{{think}}" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 20px; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); font-family: inherit; color: var(--ink); text-align: left; cursor: pointer">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5V16h8v-2.5A6 6 0 0012 3z"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">深度思考</span><span class="cap">模型支持时先思考再写，更慢</span></span>
      <span style="position: relative; width: 52px; height: 28px; background: {{swBg}}; flex: none"><span style="position: absolute; top: 4px; left: {{swLeft}}; width: 20px; height: 20px; background: var(--bg)"></span></span>
    </button>

    <div style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <button class="btn bp" type="button" style="{{saveStyle}}" aria-disabled="{{clean}}">{{saveLabel}}</button>
      <a class="btn bs" href="#" style="justify-content: space-between">换一个模型<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg></a>
      <button class="btn" type="button" style="background: transparent; color: var(--err); height: 44px; font-size: 15px; margin-top: 8px">取消导演模型</button>
      <div class="cap" style="text-align: center">取消后，新的回合会因为没有模型而无法生成。</div>
    </div>
  </sc-if>

  <sc-if value="{{notSet}}" hint-placeholder-val="{{false}}">
    <header style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--ink)">
      <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em">导演模型</h1>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: var(--mut)">导演负责写每一段故事。先选一个密钥。</p>
    </header>
    <a href="#" style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 18px; gap: 14px; align-items: center; min-height: 72px; padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none"><span class="mono" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--bg); font-size: 13px">DS</span><span style="display: flex; flex-direction: column"><span style="font-weight: 500">我的 DeepSeek</span><span class="mono" style="font-size: 12px; color: var(--mut)">•••• 3f9a · 可用</span></span><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <div style="padding: 20px"><a class="btn bs" href="#" style="justify-content: space-between">添加密钥<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></a></div>
  </sc-if>
  <div style="height: 56px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"modelSet":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { win: 64, think: true };
  }
  renderVals() {
    const ctx = 128, out = 8, unit = 4;
    const saved = { win: 64, think: true };
    const win = this.state.win;
    const used = Math.min(win, ctx);
    const story = used - out;
    const usedB = used / unit, outB = out / unit, markB = Math.floor(used * 0.8 / unit) - 1;
    const blocks = [];
    for (let k = 0; k < ctx / unit; k++) {
      let style;
      if (k < usedB - outB) style = 'background: var(--ink)';
      else if (k < usedB) style = 'background: var(--acc)';
      else style = 'box-shadow: inset 0 0 0 1px var(--line2)';
      if (k === markB) style += '; outline: 2px solid var(--warn); outline-offset: 1px';
      blocks.push({ style });
    }
    const dirty = win !== saved.win || this.state.think !== saved.think;
    const set = this.props.modelSet ?? true;
    return {
      theme: (this.props.dark ?? false) ? 'D' : 'L',
      isSet: set,
      notSet: !set,
      blocks,
      storyK: story + 'K',
      freeK: (ctx - used) + 'K',
      barLabel: '上下文 128K，故事 ' + story + 'K，每轮输出 8K，不使用 ' + (ctx - used) + 'K',
      explain: '每一格是 4K。模型最多能读 128K，你给导演 ' + used + 'K：每轮最多写 8K，剩下约 ' + story + 'K 用来记前情和世界状态。',
      capped: win > ctx,
      wins: [32, 64, 128, 256].map((w) => ({
        label: w + 'K',
        on: w === win ? 'true' : 'false',
        style: w === win ? 'background: var(--ink); color: var(--bg); font-weight: 500' : '',
        pick: () => this.setState({ win: w })
      })),
      think: this.state.think ? 'true' : 'false',
      swBg: this.state.think ? 'var(--acc)' : 'var(--line2)',
      swLeft: this.state.think ? '28px' : '4px',
      toggle: () => this.setState({ think: !this.state.think }),
      clean: dirty ? 'false' : 'true',
      saveStyle: dirty ? '' : 'opacity: .3; cursor: default',
      saveLabel: dirty ? '保存' : '保存 · 没有改动'
    };
  }
}
</script>
</body>
</html>
