<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>平板 · 登录与注册</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.L{--bg:#FFFFFF;--bg2:#F5F5F2;--bg3:#EBEBE7;--ink:#1A1A1A;--ink2:#3D3C38;--mut:#6E6D68;--line:#EEEEEA;--line2:#DCDCD6;--acc:#2F55F4;--accBg:#EEF2FF;--ok:#13875A;--okBg:#E9F6EF;--warn:#B25A0B;--warnBg:#FFF4E4;--err:#D3392B;--errBg:#FDEEEB;--pri:#1A1A1A;--onPri:#FFFFFF;--card:#FFFFFF;--scrim:rgba(20,20,20,.38);--sh:0 1px 2px rgba(20,20,20,.05),0 8px 28px rgba(20,20,20,.10)}
.bd0{display:flex;gap:40px;align-items:flex-start;font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
.cell{display:flex;flex-direction:column;gap:12px;flex:none}
.tag{display:inline-flex;align-self:flex-start;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#F5F5F2;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#6E6D68}
.fr{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased;border-radius:36px;box-shadow:0 0 0 1px #EEEEEA}
.fr *{box-sizing:border-box}
.tl{width:1194px;height:834px}
.tp{width:834px;height:1194px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border:0;border-radius:26px;font-family:inherit;font-size:16px;line-height:22px;font-weight:500;text-decoration:none;width:100%}
.bp{background:var(--pri);color:var(--onPri)}
.bs{background:var(--bg2);color:var(--ink)}
.ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;border:0;background:var(--bg2);color:var(--ink);text-decoration:none;flex:none}
.big{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:0}
.lab{font-size:13px;line-height:18px;color:var(--ink2);font-weight:500;padding-left:4px}
.inp{display:block;width:100%;height:52px;border-radius:14px;background:var(--bg2);border:0;padding:0 16px;font-family:inherit;font-size:16px;color:var(--ink);outline:none}
.inp::placeholder{color:var(--mut)}
.f{display:flex;flex-direction:column;gap:8px}
.arr{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.srv{display:flex;align-items:center;gap:10px;width:100%;height:56px;padding:0 6px 0 16px;border-radius:28px;background:var(--bg2);color:var(--mut);font-size:13px;border:0;font-family:inherit;text-align:left}
.art path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.art .s{stroke:var(--line2)}
</style>
</helmet>
<div class="bd0 L" style="width: 2068px; height: 1234px">

  <div class="cell">
    <div class="tag">T01 · 宽 · 登录（左右分栏）</div>
    <section class="fr tl" aria-label="平板登录">
      <div style="position: absolute; left: 16px; top: 16px; bottom: 16px; width: 565px; border-radius: 32px; background: var(--bg2); overflow: hidden">
        <div style="position: absolute; top: 32px; left: 32px; display: flex; align-items: center; gap: 12px">
          <svg width="40" height="40" viewBox="9.35 2.66 99.55 99.55" aria-hidden="true"><g fill="none" stroke="#1A1A1A" stroke-linejoin="miter" stroke-miterlimit="4"><path d="M57.00 18.84 L100.00 93.32 L14.00 93.32Z" stroke-width="3.24"/><path d="M66.04 13.95 L104.39 90.92 L18.56 85.65Z" stroke-width="3.24"/><path d="M60.00 33.67 L88.00 82.17 L32.00 82.17Z" stroke-width="3.51"/></g><path d="M60.00 50.99 L73.00 73.51 L47.00 73.51Z" fill="#2F55F4"/></svg>
          <span style="font-size: 17px; font-weight: 700; letter-spacing: -.01em">BetterTavern</span>
        </div>
        <svg class="art" width="565" height="802" viewBox="0 0 565 802" aria-hidden="true" style="position: absolute; inset: 0">
          <circle cx="402" cy="236" r="30" style="fill: var(--acc)"/>
          <circle cx="402" cy="236" r="58" style="fill: none; stroke: var(--line2); stroke-width: 1.5"/>
          <circle cx="402" cy="236" r="92" style="fill: none; stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 2 7"/>
          <path class="s" d="M60 330h120M60 346h76"/>
          <path d="M150 556h196l-24 30H174z"/>
          <path d="M190 556q58-58 116 0"/>
          <path d="M248 498v-50"/>
          <circle cx="248" cy="440" r="8" style="fill: var(--card); stroke: var(--ink); stroke-width: 2.2"/>
          <path d="M346 556l64-62"/>
          <path d="M-20 600q30-14 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/>
          <path class="s" d="M-20 632q30-14 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/>
          <path class="s" d="M-20 664q30-14 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/>
          <path class="s" d="M-20 696q30-14 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/>
        </svg>
        <p style="position: absolute; left: 32px; right: 32px; bottom: 32px; margin: 0; font-size: 22px; line-height: 34px; font-weight: 600; letter-spacing: -.01em">导入一张角色卡，<br>用第一人称把故事写下去。</p>
      </div>

      <div style="position: absolute; left: 581px; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="width: 400px; display: flex; flex-direction: column; gap: 32px">
          <h1 class="big">继续你的故事</h1>
          <form style="margin: 0; display: flex; flex-direction: column; gap: 16px">
            <div class="f"><label class="lab" for="ta1">邮箱</label><input id="ta1" class="inp" type="email" value="linchuan@example.com"></div>
            <div class="f"><label class="lab" for="ta2">密码</label>
              <div style="position: relative"><input id="ta2" class="inp" type="password" value="••••••••••" style="padding-right: 56px; box-shadow: 0 0 0 2px var(--acc); background: var(--bg)"><button type="button" aria-label="显示密码" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--mut); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            </div>
            <button class="btn bp" type="submit" style="justify-content: space-between; padding: 0 8px 0 24px; margin-top: 8px">登录<span class="arr"><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
            <div style="display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 14px; color: var(--mut)">还没有账户？<a href="#treg" style="height: 44px; display: flex; align-items: center; padding: 0 6px; color: var(--acc); font-weight: 500; text-decoration: none">注册</a></div>
          </form>
        </div>
        <div style="position: absolute; bottom: 32px; width: 400px">
          <button type="button" class="srv" aria-expanded="false">
            <svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
            <span style="flex: 1">服务器 <span class="mono" style="color: var(--ink)">192.168.1.10:8000</span></span>
            <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); color: var(--ink); display: flex; align-items: center; font-weight: 500">更改</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div class="cell" id="treg">
    <div class="tag">T02 · 中 · 注册 + 服务器（居中对话框）</div>
    <section class="fr tp" aria-label="平板注册与服务器对话框">
      <a class="ib" href="#" aria-label="返回登录" style="position: absolute; top: 40px; left: 32px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div style="position: absolute; top: 200px; left: 197px; width: 440px; display: flex; flex-direction: column; gap: 28px">
        <h1 class="big">创建账户</h1>
        <form style="margin: 0; display: flex; flex-direction: column; gap: 18px">
          <div class="f"><label class="lab" for="tr1">邮箱</label><input id="tr1" class="inp" type="email" value="linchuan@example.com"></div>
          <div class="f"><label class="lab" for="tr2">密码</label><input id="tr2" class="inp" type="password" value="abcd12345"></div>
          <div class="f"><label class="lab" for="tr3">昵称 <span style="color: var(--mut); font-weight: 400">可选</span></label><input id="tr3" class="inp" value="林川"></div>
          <button class="btn bp" type="submit" style="justify-content: space-between; padding: 0 8px 0 24px; margin-top: 6px">注册并登录<span class="arr"><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
        </form>
      </div>
      <div style="position: absolute; bottom: 40px; left: 197px; width: 440px">
        <button type="button" class="srv" aria-expanded="true">
          <svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
          <span style="flex: 1">服务器 <span class="mono" style="color: var(--ink)">192.168.1.10:8000</span></span>
          <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); color: var(--ink); display: flex; align-items: center; font-weight: 500">更改</span>
        </button>
      </div>

      <div style="position: absolute; inset: 0; background: var(--scrim)"></div>
      <div role="dialog" aria-label="服务器" style="position: absolute; left: 177px; width: 480px; top: 330px; background: var(--card); border-radius: 32px; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--sh)">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 8px">
          <div style="font-size: 20px; line-height: 28px; font-weight: 700">服务器</div>
          <button class="ib" type="button" aria-label="关闭" style="width: 36px; height: 36px"><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div role="radiogroup" aria-label="选择服务器" style="display: flex; flex-direction: column; gap: 6px">
          <button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border: 0; border-radius: 20px; background: var(--accBg); box-shadow: inset 0 0 0 2px var(--acc); font-family: inherit; text-align: left; color: var(--ink)">
            <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 7px var(--acc); flex: none"></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span class="mono" style="font-size: 14px">192.168.1.10:8000</span><span style="font-size: 12.5px; color: var(--mut)">上次使用 · 刚刚</span></span>
          </button>
          <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border: 0; border-radius: 20px; background: var(--bg2); font-family: inherit; text-align: left; color: var(--ink)">
            <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.75px var(--line2); flex: none"></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span class="mono" style="font-size: 14px">tavern.home.arpa</span><span style="font-size: 12.5px; color: var(--mut)">上次使用 · 3 天前</span></span>
          </button>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 8px 0 16px; border-radius: 20px; background: var(--bg2)">
            <svg class="i" style="width: 20px; height: 20px; color: var(--mut)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <label for="tns" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">新服务器地址</label>
            <input id="tns" class="mono" placeholder="输入新地址" style="flex: 1; height: 44px; border: 0; background: transparent; font-size: 14px; outline: none; color: var(--ink)">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button class="btn bs" type="button"><svg class="i" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>测试连接</button>
          <button class="btn bp" type="button">保存</button>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2068,"height":1234}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
