<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 · 注册 · 柔和圆角</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.L{--bg:#FFFFFF;--bg2:#F5F5F2;--bg3:#EBEBE7;--ink:#1A1A1A;--ink2:#3D3C38;--mut:#6E6D68;--line:#EEEEEA;--line2:#DCDCD6;--acc:#2F55F4;--accBg:#EEF2FF;--ok:#13875A;--okBg:#E9F6EF;--warn:#B25A0B;--warnBg:#FFF4E4;--err:#D3392B;--errBg:#FDEEEB;--pri:#1A1A1A;--onPri:#FFFFFF;--card:#FFFFFF;--scrim:rgba(20,20,20,.38);--sh:0 1px 2px rgba(20,20,20,.05),0 8px 28px rgba(20,20,20,.10)}
.bd0{display:flex;gap:40px;align-items:flex-start;font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
.cell{display:flex;flex-direction:column;gap:12px;flex:none}
.tag{display:inline-flex;align-self:flex-start;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#F5F5F2;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#6E6D68}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased;border-radius:44px;box-shadow:0 0 0 1px #EEEEEA}
.ph *{box-sizing:border-box}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border:0;border-radius:26px;font-family:inherit;font-size:16px;line-height:22px;font-weight:500;text-decoration:none;cursor:pointer;width:100%}
.bp{background:var(--pri);color:var(--onPri)}
.bs{background:var(--bg2);color:var(--ink)}
.ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;border:0;background:var(--bg2);color:var(--ink);text-decoration:none;flex:none}
.big{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:0}
.lab{font-size:13px;line-height:18px;color:var(--ink2);font-weight:500;padding-left:4px}
.inp{display:block;width:100%;height:52px;border-radius:14px;background:var(--bg2);border:0;padding:0 16px;font-family:inherit;font-size:16px;color:var(--ink);outline:none}
.inp::placeholder{color:var(--mut)}
.f{display:flex;flex-direction:column;gap:8px}
.arr{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.srv{position:absolute;left:20px;right:20px;bottom:34px;display:flex;align-items:center;gap:10px;height:56px;padding:0 6px 0 16px;border-radius:28px;background:var(--bg2);color:var(--mut);font-size:13px;border:0;font-family:inherit;text-align:left}
</style>
</helmet>
<div class="bd0 L" style="width: 1250px; height: 884px">

  <div class="cell">
    <div class="tag">01 · 登录</div>
    <section class="ph" aria-label="登录">
      <div style="position: absolute; top: 76px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 32px">
        <svg width="48" height="48" viewBox="9.35 2.66 99.55 99.55" aria-hidden="true"><g fill="none" stroke="#1A1A1A" stroke-linejoin="miter" stroke-miterlimit="4"><path d="M57.00 18.84 L100.00 93.32 L14.00 93.32Z" stroke-width="3.24"/><path d="M66.04 13.95 L104.39 90.92 L18.56 85.65Z" stroke-width="3.24"/><path d="M60.00 33.67 L88.00 82.17 L32.00 82.17Z" stroke-width="3.51"/></g><path d="M60.00 50.99 L73.00 73.51 L47.00 73.51Z" fill="#2F55F4"/></svg>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h1 class="big">继续你的故事</h1>
          <p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--mut)">导入一张角色卡，用第一人称把故事写下去。</p>
        </div>
        <form style="margin: 0; display: flex; flex-direction: column; gap: 16px">
          <div class="f"><label class="lab" for="a1">邮箱</label><input id="a1" class="inp" type="email" placeholder="you@example.com"></div>
          <div class="f"><label class="lab" for="a2">密码</label>
            <div style="position: relative"><input id="a2" class="inp" type="password" placeholder="至少 8 位" style="padding-right: 56px"><button type="button" aria-label="显示密码" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--mut); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          </div>
          <button class="btn bp" type="submit" style="justify-content: space-between; padding: 0 8px 0 24px; margin-top: 8px">登录<span class="arr"><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
          <div style="display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 14px; color: var(--mut)">还没有账户？<a href="#register" style="height: 44px; display: flex; align-items: center; padding: 0 6px; color: var(--acc); font-weight: 500; text-decoration: none">注册</a></div>
        </form>
      </div>
      <button type="button" class="srv" aria-expanded="false">
        <svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        <span style="flex: 1">服务器 <span class="mono" style="color: var(--ink)">192.168.1.10:8000</span></span>
        <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); color: var(--ink); display: flex; align-items: center; font-weight: 500">更改</span>
      </button>
    </section>
  </div>

  <div class="cell">
    <div class="tag">02 · 登录失败 · 服务器面板</div>
    <section class="ph" aria-label="登录失败并展开服务器设置">
      <div role="alert" style="position: absolute; z-index: 4; top: 60px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-radius: 20px; background: var(--errBg); font-size: 14px; line-height: 20px; box-shadow: var(--sh)">
        <svg class="i" style="width: 20px; height: 20px; color: var(--err)" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3L2.6 18a2 2 0 001.7 3h15.4a2 2 0 001.7-3L13.7 4.3a2 2 0 00-3.4 0z"/><path d="M12 10v4M12 17h.01"/></svg>
        <span style="flex: 1">连不上服务器，检查地址或网络。</span>
      </div>
      <div style="position: absolute; top: 160px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; opacity: .3" aria-hidden="true">
        <h1 class="big">继续你的故事</h1>
        <div style="height: 52px; border-radius: 14px; background: var(--bg2); margin-top: 24px"></div>
        <div style="height: 52px; border-radius: 14px; background: var(--bg2)"></div>
      </div>
      <div style="position: absolute; inset: 0; background: var(--scrim)"></div>
      <div role="dialog" aria-label="服务器" style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--card); border-radius: 36px; padding: 10px 16px 26px; display: flex; flex-direction: column; gap: 14px">
        <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line2)"></span>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
          <div style="font-size: 20px; line-height: 28px; font-weight: 700">服务器</div>
          <button class="ib" type="button" aria-label="关闭" style="width: 36px; height: 36px"><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div role="radiogroup" aria-label="选择服务器" style="display: flex; flex-direction: column; gap: 6px">
          <button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border: 0; border-radius: 20px; background: var(--accBg); box-shadow: inset 0 0 0 2px var(--acc); font-family: inherit; text-align: left; color: var(--ink)">
            <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 7px var(--acc); flex: none"></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span class="mono" style="font-size: 14px">192.168.1.10:8000</span><span style="font-size: 12.5px; color: var(--err)">刚才无法连接</span></span>
          </button>
          <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border: 0; border-radius: 20px; background: var(--bg2); font-family: inherit; text-align: left; color: var(--ink)">
            <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.75px var(--line2); flex: none"></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span class="mono" style="font-size: 14px">tavern.home.arpa</span><span style="font-size: 12.5px; color: var(--mut)">上次使用 · 3 天前</span></span>
          </button>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 8px 0 16px; border-radius: 20px; background: var(--bg2)">
            <svg class="i" style="width: 20px; height: 20px; color: var(--mut)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <label for="ns" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">新服务器地址</label>
            <input id="ns" class="mono" placeholder="输入新地址" style="flex: 1; height: 44px; border: 0; background: transparent; font-size: 14px; outline: none; color: var(--ink)">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button class="btn bs" type="button"><svg class="i" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>测试连接</button>
          <button class="btn bp" type="button">保存</button>
        </div>
      </div>
    </section>
  </div>

  <div class="cell" id="register">
    <div class="tag">03 · 注册 · 字段错误</div>
    <section class="ph" aria-label="注册">
      <a class="ib" href="#" aria-label="返回登录" style="position: absolute; top: 56px; left: 16px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div style="position: absolute; top: 124px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 28px">
        <h1 class="big">创建账户</h1>
        <form style="margin: 0; display: flex; flex-direction: column; gap: 18px">
          <div class="f"><label class="lab" for="r1">邮箱</label><input id="r1" class="inp" type="email" value="linchuan@example.com" aria-describedby="r1e" style="background: var(--errBg); box-shadow: inset 0 0 0 1.5px var(--err)"><div id="r1e" style="display: flex; gap: 6px; align-items: center; padding-left: 4px; color: var(--err); font-size: 13px"><svg class="i" style="width: 15px; height: 15px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>这个邮箱已经注册过了</div></div>
          <div class="f"><label class="lab" for="r2">密码</label><input id="r2" class="inp" type="password" value="abc1234" aria-describedby="r2e" style="background: var(--bg); box-shadow: 0 0 0 2px var(--acc)">
            <div style="display: flex; align-items: center; gap: 10px; padding-left: 4px"><div style="flex: 1; height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden" aria-hidden="true"><div style="width: 87%; height: 6px; border-radius: 3px; background: var(--ink)"></div></div><span id="r2e" class="mono" style="font-size: 12px; color: var(--mut)">7 / 8</span></div>
          </div>
          <div class="f"><div style="display: flex; justify-content: space-between"><label class="lab" for="r3">昵称 <span style="color: var(--mut); font-weight: 400">可选</span></label><span class="mono" style="font-size: 12px; color: var(--mut)">2 / 40</span></div><input id="r3" class="inp" value="林川"></div>
          <button class="btn bp" type="submit" style="justify-content: space-between; padding: 0 8px 0 24px; margin-top: 6px; opacity: .3" aria-disabled="true">注册并登录<span class="arr"><svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
        </form>
      </div>
      <button type="button" class="srv" aria-expanded="false">
        <svg class="i" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        <span style="flex: 1">服务器 <span class="mono" style="color: var(--ink)">192.168.1.10:8000</span></span>
        <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); color: var(--ink); display: flex; align-items: center; font-weight: 500">更改</span>
      </button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1250,"height":884}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
