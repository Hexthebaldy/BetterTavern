<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 这里是中文页的标题和描述（描述和首屏那句介绍一样，文案的 hero.lead）；预渲染时按语言换掉（scripts/head.ts），冒烟测试会对照 -->
    <title>BetterTavern · 用 SillyTavern 角色卡玩的互动小说</title>
    <meta name="description" content="用 SillyTavern 角色卡玩的互动小说。AI 用第一人称写一段故事，结尾给两个选项；想做选项之外的事，可以自己写一句。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BetterTavern" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="BetterTavern · 用 SillyTavern 角色卡玩的互动小说" />
    <meta property="og:description" content="用 SillyTavern 角色卡玩的互动小说。AI 用第一人称写一段故事，结尾给两个选项；想做选项之外的事，可以自己写一句。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="../web/public/favicon.svg" type="image/svg+xml" />
    <noscript>
      <style>
        /* 不开 JS 时：常见问题全部展开；部署的四组命令竖着全部显示，标签栏和复制按钮藏起来。
           这段在样式表前面，和样式表冲突的几条要加 !important */
        .faq-a { grid-template-rows: 1fr; }
        .codes { height: auto !important; overflow: visible !important; }
        .codes-track { flex-direction: column; gap: 16px; transform: none !important; }
        .codes-track > .code { flex: none !important; width: 100% !important; visibility: visible !important; }
        .code .nojs { display: inline; }
        .tabs, .code .cp { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
