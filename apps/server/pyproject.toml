[project]
name = "bettertavern"
version = "0.1.0"
description = "BetterTavern 服务端：生成式互动小说的 agent runtime"
readme = "README.md"
requires-python = ">=3.12"
# 直接依赖精确锁定，与 uv.lock 一致；升级时改这里，再执行 `uv lock`
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  # 密钥信封加密（AES-GCM）与密码哈希（Argon2id，46 起提供 PHC 编码）
  "cryptography==50.0.2",
  "pyjwt==2.15.1",
  # 角色卡上传（multipart）
  "python-multipart==0.0.32",
  # 结构化日志（JSON 输出、上下文绑定、脱敏处理器）
  "structlog==26.1.0",
]

[project.scripts]
bettertavern = "bettertavern.entrypoints.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "anyio==4.15.1",
  "ruff==0.17.0",
  "pyright==1.1.414",
  "import-linter==2.15",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bettertavern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "integration: 需要真实 Postgres，设置 BT_TEST_DATABASE_URL 后才会运行",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# 中文文本里的全角标点会被 RUF001-003 当成“易混淆字符”；ASYNC109 与 httpcore 接口签名冲突
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["bettertavern", "tests", "evals"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
