# 阶段 2 的 100 回合剧本试玩用的剧本（合成数据，不含真实用户数据），用法见 evals/README.md。
# script 里每一项是一回合："@option" 表示按种子随机点模型给的两个选项之一（没有选项时写一句继续），其余是玩家自己写的行动。
# checks 是检查点：整理完第 after 回合以后，世界应该是什么样。人和物按名字或别名找，名字里包含所写的字就算对上。
# 检查的种类见 evals/playtest_report.py 的 CHECK_KINDS。
# 自己写的行动专门考世界状态整理：交出和藏起物品、换地方、遇到新人物、有人死去、得知秘密、有人离开。
# recall 是召回题：第 1、10、26 回合玩家自己说出一个细节（火漆上的图案、搬运工的刺青、驿站的名字），
# 第 84、90、99 回合再问；那一回合的叙述里要出现 expect 里的词。用 --history-block 让早先的回合移出上下文时，
# 导演要靠召回工具（或者世界状态里记下的事实）才答得上来。
id: tavern_100
title: 雨夜酒馆（100 回合）
language: zh
protagonist:
  name: 林川
  summary: 二十出头的信使，替北境商会送一封没写收件人的信，身上只剩三枚银币。
preferences:
  length: short  # 篇幅短一些，100 回合跑得快、花得少
card:
  name: 老周
  description: |-
    架空的边陲小镇“灰石镇”，蒸汽机械与少量魔法并存；雨季已经持续了三周，镇上的人对外乡人很警惕。
    镇上唯一的酒馆由掌柜老周经营：五十多岁，话少，消息灵通，欠北境商会一笔钱。
    酒馆的帮工阿苓十七岁，想离开灰石镇，偷偷收集各地的地图。
    酒馆角落常坐着一个戴兜帽的人，左手缺了一根手指，似乎在等什么人。
    镇子东边是码头和货栈，北境商会的船每隔几天靠岸一次；往北走两天是商会的分号。
  scenario: 雨夜，信使林川推开灰石镇唯一一家酒馆的门。
  first_mes: 我推开灰石镇唯一一家酒馆的门，雨水顺着斗篷往下淌，屋里的人都抬起了头。
script:
  - 我把信放在柜台上，问老周认不认识信封上的火漆——火漆上压着一只衔着钥匙的乌鸦。  # 1
  - "@option"  # 2
  - 我把三枚银币中的一枚推给老周，换一间过夜的房间。  # 3
  - "@option"  # 4
  - 我问阿苓镇上最近有没有来过别的外乡人。  # 5
  - "@option"  # 6
  - "@option"  # 7
  - 我跟着戴兜帽的人走出酒馆，冒雨走向码头。  # 8
  - "@option"  # 9
  - 我在码头的货栈里躲雨，留意谁在搬运货物，看见一个搬运工的胳膊上刺着一条青蛇。  # 10
  - "@option"  # 11
  - 我向看守货栈的老人打听北境商会的船什么时候到。  # 12
  - "@option"  # 13
  - "@option"  # 14
  - 我把信藏进货栈角落的一个空木箱里，只带着拆下来的火漆离开。  # 15
  - "@option"  # 16
  - 我回到酒馆，把在码头看到的事告诉老周。  # 17
  - "@option"  # 18
  - "@option"  # 19
  - 我请阿苓帮我画一张去北境商会分号的路线图。  # 20
  - 阿苓把画好的路线图塞给我，我收进怀里。  # 21
  - "@option"  # 22
  - 天亮了，我离开灰石镇，沿着阿苓画的路往北走。  # 23
  - "@option"  # 24
  - "@option"  # 25
  - 我在路边一家门口挂着“归雁”木牌的驿站停下，用一枚银币买了干粮。  # 26
  - "@option"  # 27
  - "@option"  # 28
  - 我回头确认有没有人跟着我。  # 29
  - "@option"  # 30
  - "@option"  # 31
  - 我在驿站认出了那个戴兜帽的人，当面问他为什么跟着我。  # 32
  - "@option"  # 33
  - "@option"  # 34
  - 我把阿苓画的地图摊开，问戴兜帽的人商会分号是不是在这里。  # 35
  - "@option"  # 36
  - "@option"  # 37
  - "@option"  # 38
  - 我决定连夜赶路，不在驿站过夜。  # 39
  - "@option"  # 40
  - "@option"  # 41
  - 我到了北境商会的分号，要求见管事的人。  # 42
  - "@option"  # 43
  - "@option"  # 44
  - 我告诉管事：信被我藏在灰石镇码头货栈的木箱里了。  # 45
  - "@option"  # 46
  - "@option"  # 47
  - "@option"  # 48
  - 我答应管事回灰石镇把信取回来，换一笔报酬。  # 49
  - "@option"  # 50
  - "@option"  # 51
  - 我向管事借了一匹马，往回赶。  # 52
  - "@option"  # 53
  - "@option"  # 54
  - 路上我听过路的商人说，灰石镇的码头昨夜起了大火。  # 55
  - "@option"  # 56
  - "@option"  # 57
  - 我回到灰石镇，直奔码头的货栈。  # 58
  - "@option"  # 59
  - "@option"  # 60
  - 我在烧焦的木箱里翻找那封信。  # 61
  - "@option"  # 62
  - "@option"  # 63
  - 我去酒馆找老周，发现酒馆关着门。  # 64
  - "@option"  # 65
  - "@option"  # 66
  - 阿苓告诉我，老周在大火那晚被人害死了。  # 67
  - "@option"  # 68
  - "@option"  # 69
  - 我去老周的坟前，把那枚火漆放在墓碑上。  # 70
  - "@option"  # 71
  - "@option"  # 72
  - 我问阿苓愿不愿意跟我一起离开灰石镇。  # 73
  - "@option"  # 74
  - "@option"  # 75
  - 我把阿苓画的地图还给她。  # 76
  - "@option"  # 77
  - "@option"  # 78
  - 我和阿苓坐上北境商会的船离开灰石镇。  # 79
  - "@option"  # 80
  - "@option"  # 81
  - 在船上，我问阿苓她收集的地图里有没有标着北境商会的仓库。  # 82
  - "@option"  # 83
  - 我问阿苓还记不记得，当初那枚火漆上压的是什么图案。  # 84
  - 我在船舱里撞见了那个戴兜帽的人。  # 85
  - "@option"  # 86
  - "@option"  # 87
  - 我当着阿苓的面问戴兜帽的人：码头那把火是不是他放的。  # 88
  - "@option"  # 89
  - 我想起码头货栈里那个胳膊上有刺青的搬运工，把那刺青的样子描述给戴兜帽的人听，问他认不认识这个人。  # 90
  - 船靠岸后，我把戴兜帽的人交给了北境商会的管事。  # 91
  - "@option"  # 92
  - "@option"  # 93
  - 我收下报酬，分了一半给阿苓。  # 94
  - "@option"  # 95
  - "@option"  # 96
  - 阿苓登上去南方的船，从此离开了，我们没再见面。  # 97
  - "@option"  # 98
  - 我在纸上写下这一路落脚过的地方，头一个就是北上路上那家驿站，我把它的名字写了下来。  # 99
  - 我在北境商会的分号住下，开始写这一路的经历。  # 100
checks:
  - after: 15
    expect:
      - not_holds: [林川, 信]      # 信藏进了货栈的木箱
      - holds: [林川, 火漆]        # 只带走了拆下来的火漆
  - after: 21
    expect:
      - holds: [林川, 图]          # 阿苓画的路线图（或叫地图）
  - after: 23
    expect:
      - not_at: [林川, 酒馆]       # 离开了灰石镇
  - after: 42
    expect:
      - at: [林川, 分号]           # 到了北境商会的分号
  - after: 45
    expect:
      - fact: [信, 箱]             # 记住了信藏在木箱里
  - after: 70
    expect:
      - retired: 老周              # 老周死在大火那晚
  - after: 80
    expect:
      - together: [林川, 阿苓]     # 两人坐同一条船离开
  - after: 91
    expect:
      - apart: [林川, 兜帽]        # 戴兜帽的人交给了管事
  - after: 98
    expect:
      - gone: 阿苓                 # 阿苓去了南方，已退场或者不在场
recall:
  - turn: 84
    expect: [乌鸦]                 # 第 1 回合：火漆上压着衔着钥匙的乌鸦
  - turn: 90
    expect: [蛇]                   # 第 10 回合：搬运工胳膊上刺着青蛇
  - turn: 99
    expect: [归雁]                 # 第 26 回合：驿站门口挂着“归雁”木牌
