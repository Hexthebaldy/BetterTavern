# 阶段 5 的偏离剧本（合成数据，不含真实用户数据），用法见 evals/README.md。
# 世界和角色卡同 tavern_100。前 20 回合照着送信的主线走；第 21～40 回合玩家放弃送信，留在灰石镇跟老渔夫学打鱼、
# 攒钱买船；第 41～60 回合接着新方向玩。看大纲修订“该改时改、不该改时不改”，以及改完以后有没有跟上玩家。
# script 里每一项是一回合："@option" 表示按种子随机点模型给的两个选项之一，其余是玩家自己写的行动。
# outline 是大纲检查（evals/playtest_outline.py）：依据在 from～to 回合里的修订改了几次（第一版不算），
# 第 to 回合时正在用的那一版大纲（前提和还没完成的拍）里要不要出现 mentions 里的某个词。只列结果，不算进结论。
id: detour_60
title: 雨夜酒馆（60 回合，中途改道）
language: zh
protagonist:
  name: 林川
  summary: 二十出头的信使，替北境商会送一封没写收件人的信，身上只剩三枚银币。
preferences:
  length: short
card:
  name: 老周
  description: |-
    架空的边陲小镇“灰石镇”，蒸汽机械与少量魔法并存；雨季已经持续了三周，镇上的人对外乡人很警惕。
    镇上唯一的酒馆由掌柜老周经营：五十多岁，话少，消息灵通，欠北境商会一笔钱。
    酒馆的帮工阿苓十七岁，想离开灰石镇，偷偷收集各地的地图。
    酒馆角落常坐着一个戴兜帽的人，左手缺了一根手指，似乎在等什么人。
    镇子东边是码头和货栈，北境商会的船每隔几天靠岸一次；往北走两天是商会的分号。
  scenario: 雨夜，信使林川推开灰石镇唯一一家酒馆的门。
  first_mes: 我推开灰石镇唯一一家酒馆的门，雨水顺着斗篷往下淌，屋里的人都抬起了头。
script:
  # 第 1～20 回合：照着送信的主线走
  - 我把信放在柜台上，问老周认不认识信封上的火漆。  # 1
  - "@option"  # 2
  - 我问老周去北境商会的分号怎么走。  # 3
  - "@option"  # 4
  - "@option"  # 5
  - 我请阿苓帮我画一张去分号的路线图。  # 6
  - "@option"  # 7
  - "@option"  # 8
  - 我在酒馆住下，打算天亮就出发去北境。  # 9
  - "@option"  # 10
  - 天亮了，我带着信离开灰石镇，沿着阿苓画的路往北走。  # 11
  - "@option"  # 12
  - "@option"  # 13
  - 我在路边的驿站歇脚，打听分号的管事是谁。  # 14
  - "@option"  # 15
  - "@option"  # 16
  - 我留意有没有人跟着我。  # 17
  - "@option"  # 18
  - "@option"  # 19
  - "@option"  # 20
  # 第 21～40 回合：玩家不送信了，回灰石镇学打鱼、攒钱买船
  - 我停下脚步，决定不再替商会送这封信了。我把信塞回怀里，掉头往灰石镇走。  # 21
  - 我回到灰石镇的码头，找到一个正在补网的老渔夫，问他收不收徒弟。  # 22
  - "@option"  # 23
  - 我答应老渔夫，每天帮他补网、搬鱼，换他教我打鱼。  # 24
  - "@option"  # 25
  - 天还没亮，我跟着老渔夫的小船出海，学着撒网。  # 26
  - "@option"  # 27
  - 我把渔网收上来，数一数网里有几条鱼。  # 28
  - 我把第一次自己打到的鱼拿到集市上卖，数了数挣到的铜板。  # 29
  - "@option"  # 30
  - 我问老渔夫，镇上有没有人要卖旧船。  # 31
  - "@option"  # 32
  - 我接着跟老渔夫出海，学怎么看天色和水流。  # 33
  - 我去看那条要卖的旧船，跟船主讨价还价。  # 34
  - "@option"  # 35
  - 我把攒下的铜板和剩下的银币都拿出来，付了旧船的定金。  # 36
  - "@option"  # 37
  - 我和老渔夫一起把旧船拖上岸，补好船底的裂缝。  # 38
  - 我给自己的船刷上新漆，在船头写上名字。  # 39
  - "@option"  # 40
  # 第 41～60 回合：接着新方向玩
  - "@option"  # 41
  - 我第一次一个人驾着自己的船出海。  # 42
  - "@option"  # 43
  - "@option"  # 44
  - "@option"  # 45
  - 我把打到的鱼卖给酒馆的老周，顺便请他喝一杯。  # 46
  - "@option"  # 47
  - "@option"  # 48
  - "@option"  # 49
  - 我修好被风浪打坏的船帆。  # 50
  - "@option"  # 51
  - "@option"  # 52
  - "@option"  # 53
  - 我在码头和别的渔夫商量，一起去远一点的渔场。  # 54
  - "@option"  # 55
  - "@option"  # 56
  - "@option"  # 57
  - "@option"  # 58
  - "@option"  # 59
  - 我把船靠岸，坐在船头看着灰石镇的灯火。  # 60
outline:
  # 照着走的时候：大纲只随着一拍拍完成而前进，不该改得很勤；第 20 回合时大纲还是送信这条线
  - from: 0
    to: 20
    max_changes: 6
    mentions: ["信", "北境", "分号"]
  # 改道以后：大纲要跟上玩家，第 45 回合时（给后台留几回合）正在用的大纲里是打鱼、船这条线
  - from: 21
    to: 45
    min_changes: 1
    mentions: ["渔", "船"]
  # 接着新方向：大纲不该又拉回送信，第 60 回合时还是打鱼、船这条线
  - from: 46
    to: 60
    max_changes: 6
    mentions: ["渔", "船"]
