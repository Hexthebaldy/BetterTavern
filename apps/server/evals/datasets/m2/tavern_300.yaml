# 阶段 4（分层记忆）的 300 回合剧本试玩用的剧本（合成数据，不含真实用户数据），用法见 evals/README.md。
# 第 1 到 100 回合和 tavern_100 一样；第 101 到 200 回合林川在北境商会分号查账、在议事会上作证；
# 第 201 到 300 回合带查账人回灰石镇查证。script、checks、recall 的写法同 tavern_100。
# 后面的召回题都是主角自己回想很早以前的细节：第 250 回合想火漆的图案（第 1 回合说的）、第 265 回合想铁匣子底下的刻字
# （第 115 回合）、第 270 回合想搬运工的刺青（第 10 回合）、第 285 回合写避风小岛的名字（第 212 回合）、
# 第 290 回合写第一个驿站的名字（第 26 回合）。这时那些回合早已不在导演的上下文里，要靠章节摘要、世界状态或召回工具。
id: tavern_300
title: 雨夜酒馆（300 回合）
language: zh
protagonist:
  name: 林川
  summary: 二十出头的信使，替北境商会送一封没写收件人的信，身上只剩三枚银币。
preferences:
  length: short
card:
  name: 老周
  description: '架空的边陲小镇“灰石镇”，蒸汽机械与少量魔法并存；雨季已经持续了三周，镇上的人对外乡人很警惕。

    镇上唯一的酒馆由掌柜老周经营：五十多岁，话少，消息灵通，欠北境商会一笔钱。

    酒馆的帮工阿苓十七岁，想离开灰石镇，偷偷收集各地的地图。

    酒馆角落常坐着一个戴兜帽的人，左手缺了一根手指，似乎在等什么人。

    镇子东边是码头和货栈，北境商会的船每隔几天靠岸一次；往北走两天是商会的分号。'
  scenario: 雨夜，信使林川推开灰石镇唯一一家酒馆的门。
  first_mes: 我推开灰石镇唯一一家酒馆的门，雨水顺着斗篷往下淌，屋里的人都抬起了头。
script:
