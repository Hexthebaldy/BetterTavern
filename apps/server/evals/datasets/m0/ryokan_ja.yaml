# 日文提示词的导演协议合规率评测用的合成剧本（不含任何真实用户数据）
id: ryokan_ja
title: 霧の宿
language: ja
world: 山あいの温泉町「霧沢」。明治の終わりごろで、鉄道がようやく通ったばかり。霧の深い夜には、町の古い宿に「戻らない客」が泊まりに来るという言い伝えがある。
protagonist:
  name: 朝霧湊
  description: 二十代前半の新聞記者。行方不明になった兄の手紙を頼りに霧沢へ来た。財布の中身は心もとない。
characters:
  - name: 女将の志乃
    description: 四十代。物腰はやわらかいが、宿の古い帳簿のことになると口が重くなる。
  - name: 番頭の源さん
    description: 六十過ぎ。耳が遠いふりをして、客の話をよく聞いている。
  - name: 千代
    description: 宿で働く十六歳の娘。町の外の世界に憧れ、客の荷物の切手をこっそり集めている。
style: 現在形を中心に、抑えた語り口で具体的に描く。会話は短く、形容詞を重ねすぎない。
length: medium  # 分量：short / medium / long。説明の文言は ja/director.system.j2 にある
opening: 冒頭：霧の中、私は霧沢でいちばん古い宿の玄関に立つ。帳場の明かりの下で、女将が顔を上げる。
# ときどき選択肢の代わりに自由入力を使い、選択肢以外の行動への監督の対応を確かめる
actions:
  - 私は兄の手紙を帳場に置き、この消印に見覚えはないかと女将に尋ねる。
  - 私は酔ったふりをして、番頭の源さんに昔の泊まり客の話を振る。
  - 私は千代に、最近ほかに町の外から来た客はいなかったかと聞く。
  - 私は財布の小銭を数え、いちばん安い素泊まりの部屋を頼む。
  - 私は窓辺に立ち、霧の向こうからこちらを見ている者がいないか確かめる。
  - 私は帳場の皆に言う。「この手紙の差出人を知っている人がいたら、話を聞かせてほしい」
