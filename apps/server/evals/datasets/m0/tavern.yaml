# M0 导演协议合规率评测用的合成剧本（不含任何真实用户数据）
id: tavern
title: 雨夜酒馆
language: zh
world: 架空的边陲小镇“灰石镇”，蒸汽机械与少量魔法并存；雨季已经持续了三周，镇上的人对外乡人很警惕。
protagonist:
  name: 林川
  description: 二十出头的信使，替北境商会送一封没写收件人的信，身上只剩三枚银币。
characters:
  - name: 掌柜老周
    description: 五十多岁，话少，消息灵通，欠北境商会一笔钱。
  - name: 戴兜帽的人
    description: 坐在角落，左手缺了一根手指，似乎在等什么人。
  - name: 阿苓
    description: 酒馆的帮工，十七岁，想离开灰石镇，偷偷收集各地的地图。
style: 现在时，语言克制，细节具体，对话简短，少用形容词堆砌。
length: medium  # 篇幅：short / medium / long，说明文字在 director.system.j2 里
opening: 开场：我推开灰石镇唯一一家酒馆的门，雨水顺着斗篷往下淌，屋里的人都抬起了头。
# 偶尔用自由输入代替选项，检验导演对非选项行动的处理
actions:
  - 我把信放在柜台上，问老周认不认识信封上的火漆。
  - 我假装喝醉，摇摇晃晃地凑近那个戴兜帽的人。
  - 我问阿苓镇上最近有没有来过别的外乡人。
  - 我数了数身上的银币，点了一碗最便宜的汤。
  - 我走到窗边，看雨里有没有人在盯着酒馆。
  - 我对所有人说：这封信没有收件人，谁认得它，谁就能拿走。
