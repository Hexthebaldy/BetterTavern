[importlinter]
root_package = bettertavern

[importlinter:contract:layers]
name = 分层：entrypoints → api → services → runtime → domain
type = layers
layers =
    bettertavern.entrypoints
    bettertavern.api
    bettertavern.services
    bettertavern.runtime
    bettertavern.domain

[importlinter:contract:domain-pure]
name = domain 只用标准库和 pydantic
type = forbidden
source_modules =
    bettertavern.domain
forbidden_modules =
    bettertavern.providers
    bettertavern.infra
    bettertavern.settings

[importlinter:contract:providers-standalone]
name = providers 不 import 本项目的其他包
type = forbidden
source_modules =
    bettertavern.providers
forbidden_modules =
    bettertavern.domain
    bettertavern.runtime
    bettertavern.services
    bettertavern.api
    bettertavern.infra
    bettertavern.entrypoints
    bettertavern.settings

[importlinter:contract:api-no-providers]
name = 只有 runtime 和 services 可以使用 providers
type = forbidden
source_modules =
    bettertavern.api
forbidden_modules =
    bettertavern.providers
# 经 services 间接用到 providers 是分层允许的；这里只禁止 api 直接 import
allow_indirect_imports = true

[importlinter:contract:infra-leaf]
name = infra 是叶子
type = forbidden
source_modules =
    bettertavern.infra
forbidden_modules =
    bettertavern.runtime
    bettertavern.services
    bettertavern.api
    bettertavern.entrypoints

[importlinter:contract:runtime-ports-only]
name = runtime 只通过 ports 访问持久化
type = forbidden
source_modules =
    bettertavern.runtime
forbidden_modules =
    bettertavern.infra

[importlinter:contract:vis-isolated]
name = vis 是本机的只读调试工具，业务代码不 import 它
type = forbidden
source_modules =
    bettertavern.api
    bettertavern.services
    bettertavern.runtime
    bettertavern.domain
    bettertavern.infra
    bettertavern.providers
    bettertavern.importers
forbidden_modules =
    bettertavern.vis

[importlinter:contract:vis-read-only]
name = vis 只读日志和数据库，不调业务层
type = forbidden
source_modules =
    bettertavern.vis
forbidden_modules =
    bettertavern.api
    bettertavern.services
    bettertavern.runtime
    bettertavern.providers

